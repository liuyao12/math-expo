name: Publish Math Expo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build all three mathematics projects
        run: npm run build
      - name: Validate mathematics and local resources
        run: npm run check
      - name: Package validated website without host metadata
        run: python3 scripts/package-pages.py dist "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: pages_artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact-id }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' | grep -Fxq "$PAGES_ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "The Pages artifact was not listed within one minute."
          exit 1

      - name: Publish to GitHub Pages
        id: deployment
        timeout-minutes: 12
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact-id }}
        with:
          script: |
            // Use the uploader's exact ID instead of a second artifact lookup.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return a valid artifact ID.');
            }
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            const target = { ...context.repo, deployment_id: deploymentId };
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', target);
                if (data.status === 'succeed') {
                  core.setOutput('status', 'succeed');
                  return;
                }
                if (failed.has(data.status)) throw new Error(`Pages publication ended with ${data.status}.`);
              } catch (error) {
                if (error.status !== 404 && !(error.status >= 500)) throw error;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', target);
            throw new Error('Pages publication did not finish within ten minutes.');
