name: Publish Math Expo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this publication
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - math-expo-local-53f0316

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      LOCAL_RUNNER_MACHINE: ${{ secrets.MATH_EXPO_TEMP_RUNNER_MACHINE_53F0316 }}
      LOCAL_RUNNER_MACHINE_SHORT: ${{ secrets.MATH_EXPO_TEMP_RUNNER_MACHINE_SHORT_53F0316 }}
      LOCAL_RUNNER_HOME: ${{ secrets.MATH_EXPO_TEMP_RUNNER_HOME_53F0316 }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build all three mathematics projects
        run: npm run build
      - name: Validate mathematics and local resources
        run: npm run check
      - uses: actions/upload-pages-artifact@v4
        if: runner.environment != 'self-hosted'
        with:
          path: dist

      - name: Package validated files on the temporary local runner
        if: runner.environment == 'self-hosted'
        run: |
          python3 -c 'from pathlib import Path; assert all(not p.is_symlink() and (p.is_dir() or (p.is_file() and p.stat().st_nlink == 1)) for p in Path("dist").rglob("*"))'
          tar -cf "$RUNNER_TEMP/artifact.tar" -C dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.environment == 'self-hosted'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
