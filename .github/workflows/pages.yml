name: Publish Math Expo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Temporary publication runner
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - math-expo-counts-once

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      MATH_EXPO_TEMP_COUNTS_MACHINE: ${{ secrets.MATH_EXPO_TEMP_COUNTS_MACHINE }}
      MATH_EXPO_TEMP_COUNTS_MACHINE_SHORT: ${{ secrets.MATH_EXPO_TEMP_COUNTS_MACHINE_SHORT }}
      MATH_EXPO_TEMP_COUNTS_HOME: ${{ secrets.MATH_EXPO_TEMP_COUNTS_HOME }}

    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build all three mathematics projects
        run: npm run build
      - name: Validate mathematics and local resources
        run: npm run check
      - name: Package validated website without host metadata
        run: python3 scripts/package-pages.py dist "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
